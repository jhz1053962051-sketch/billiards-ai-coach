# CI：单元测试 + 类型检查 + 演示页静态检查 + 浏览器端到端（verify:demo）。
#
# 为什么会有一份 package-lock.json（原来没有）：
#   运行时仍然是零依赖——package.json 里没有 dependencies。新增的 typescript 只在
#   devDependencies 里，是开发期工具（`npm run typecheck` 用它跑 tsc），不会被任何
#   src/ 或 demo/ 的代码 import，也不进 vendor/ 那套静态资源。有了 lockfile 之后
#   setup-node 的 cache: npm 才可用（没有 lockfile 时它会报
#   "Dependencies lock file is not found"），所以下面既 npm ci 也开了缓存。
#
# 为什么 CI 不跑姿态页（verify-pose）：
#   tools/verify-pose.mjs:39-48 的照片/录像素材默认取自 _research/，而 _research/
#   被 .gitignore 排除、不进仓库。干净 clone 上它必然走「缺素材 → 跳过」分支
#   （tools/verify-pose.mjs:217-223、:353-354），只剩 3 条降级断言；叠上
#   POSE_STRICT=1 会直接把 CI 判红。要上 CI，得先把素材放进仓库或改成可下载。
#
# 同理也没有 `VERIFY_STRICT=1 npm run verify`：verify-all 里含姿态页，
# 在干净 clone 上严格模式必红。
#
# Chrome 来源：ubuntu-latest 镜像自带 Google Chrome stable（/usr/bin/google-chrome）。
#   tools/cdp.mjs:20-32 的候选列表已含 /usr/bin/google-chrome、google-chrome-stable、
#   chromium、chromium-browser，且支持 CHROME_PATH 覆盖（tools/cdp.mjs:21），
#   所以不需要 setup-chrome 之类的第三方 action。
#
# 为什么钉 v5（而不是 v4）：
#   v4 系列声明的 node20 runtime 已被 GitHub 弃用，CI 会把它们强制在 node24 上跑，
#   并打一条 "Node.js 20 is deprecated ... forced to run on Node.js 24" 告警。
#   actions/checkout 与 actions/setup-node 的 v5 已把 runtime 换成 node24，
#   升级后该告警消失（tag 由 git ls-remote 核实存在）。

name: verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 与 package.json 的 engines.node >= 22 对齐；22 是最低支持线，24 是当前线。
        node-version: [22, 24]

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          # lockfile 现在有了（见过文件头），所以缓存可用；只在 lockfile 变化时失效。
          cache: npm

      - name: 安装开发期依赖
        # typescript 是唯一的 devDependency（`npm run typecheck` 用它）；运行时零依赖，
        # 所以 `npm ci --omit=dev` 在这里不合适——那会装不到 tsc。
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        # src/ 走「tsconfig 里 checkJs: false + 各文件自己写 // @ts-check」的选择性开启，
        # 没写 @ts-check 的文件（physics/sim/solver/constants）本轮不校验，但仍参与类型推断。
        run: npm run typecheck

      - name: dist 过期检查
        # dist/ 是入库的最小化产物（33 个文件），tools/build-min.mjs --check 会重算
        # 每个文件的字节并与磁盘逐字节比对，源改了却忘了重建就直接判红——这是
        # 「改了 src/demo 但 dist 静默过期」唯一的保护。
        #
        # 为什么要先补两个文件：dist/vendor/pose/pose_landmarker_lite.task（5.7 MB）与
        # dist/vendor/pose/wasm/vision_wasm_internal.wasm（14.5 MB）被 .gitignore 排除，
        # 干净 clone 上没有；而 --check 对 COPY_TARGETS 也会逐字节比对，缺席就报
        # 「缺文件」把整步判红（本地已实测：干净 clone + autocrlf=false 只报这两条）。
        # 这两个产物本来就是从 vendor/ 原样复制，所以先补进去；若 vendor 源真变了却
        # 没重建，BUILD.json 里的 sha256 会对不上，--check 仍会报「BUILD.json 与当前
        # 源码不一致」，不会因此漏判。
        run: |
          mkdir -p dist/vendor/pose/wasm
          cp vendor/pose/pose_landmarker_lite.task dist/vendor/pose/
          cp vendor/pose/wasm/vision_wasm_internal.wasm dist/vendor/pose/wasm/
          npm run check:dist

      - name: 单元测试
        run: npm test

      - name: 演示页静态检查
        run: npm run check:demo

      - name: 确认 Chrome 可用
        # verify-demo 会自己按候选路径找 Chrome（tools/cdp.mjs:41-52）；
        # 这一步只是为了在镜像变了的时候先给一句明白话，而不是让 E2E 报「找不到 Chrome」。
        run: google-chrome --version

      - name: 浏览器端到端（verify:demo）
        timeout-minutes: 10
        env:
          # 缺了它 verify-demo 会去连默认的 http://127.0.0.1:4173/demo/
          DEMO_URL: http://127.0.0.1:4173/demo/
        run: |
          # verify-demo 只负责连服务，不负责起服务（tools/verify-demo.mjs:25-32）。
          # 端口用它的默认值 4173；下面先轮询到页面可访问再跑断言。
          node tools/serve.mjs 4173 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS "$DEMO_URL" > /dev/null; then break; fi
            sleep 0.5
          done
          # 60 次仍未就绪就在这里失败，比让 E2E 后面报「页面 null」好定位。
          curl -fsS "$DEMO_URL" > /dev/null
          # tools/verify-demo.mjs:48 已经带上 --disable-dev-shm-usage（提交 06635c7），
          # GitHub runner /dev/shm 只有 64 MB 这条老风险因此不再适用。若这里仍出现
          # Chrome 崩溃（Target closed / SIGTRAP），那是别的原因，得重新查，不要默认
          # 当成环境问题放过。
          npm run verify:demo